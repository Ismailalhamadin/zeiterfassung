<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeiterfassung · Demo</title>
    <meta name="description" content="Zeiterfassung als Browser-Demo mit Beispieldaten. Änderungen werden nicht gespeichert." />
    <!-- Basispfad: lokal und im Docker-Abbild "/". Für einen Unterpfad (z. B. /demos/zeiterfassung/) siehe docker/set-base-path.sh. -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/demo.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="demo-loading"><span class="tt-spinner"></span> <span class="loading-progress-text"></span></div>
    </div>

    <div id="blazor-error-ui">
        Ein Fehler ist aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">×</span>
    </div>
    <script src="js/demo.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // Die Oberfläche ist deutsch, egal in welcher Sprache der Browser steht. Die Kultur muss beim Start
        // gesetzt werden (nicht später in Program.cs): Blazor lädt dazu die passende ICU-Datei (de) und
        // verbietet sonst jede Änderung der Startkultur.
        Blazor.start({ applicationCulture: 'de-DE' });
    </script>
</body>

</html>
