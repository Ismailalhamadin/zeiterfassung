server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/headers.inc;

    # Blazor liefert jede Datei zusätzlich vorkomprimiert (.gz) aus.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # WebAssembly (.wasm) kennt die mitgelieferte mime.types bereits. Keinen eigenen types-Block
    # anlegen: er würde die ganze Standardliste ersetzen.

    # Dateien unter _framework/ tragen den Hash im Namen: dauerhaft zwischenspeichern.
    location /_framework/ {
        expires max;
    }

    # Die Startseite nie veraltet ausliefern, sonst fehlen neue Dateinamen.
    location = /index.html {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "no-cache";
    }

    # Single-Page-App: unbekannte Adressen (z. B. /entries beim Neuladen) gehen an index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
